<!doctype html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo/property_clinic_main_logo.png" />

    <!-- Fallback SEO (overridden by React Helmet on each route) -->
    <title>Kashi Property Clinic | Trusted Real Estate in Kashipur</title>
    <meta name="description" content="Kashi Property Clinic — your trusted real estate partner in Kashipur, Uttarakhand. Explore premium villas, plots, flats and commercial properties. Call +91-9627088818." />
    <meta name="keywords" content="property in Kashipur, real estate Kashipur, buy property Kashipur, villas Kashipur, plots Kashipur, Kashi Property Clinic, Kashipur Property Clinic" />
    <meta name="author" content="Kashi Property Clinic" />
    <meta name="robots" content="index, follow" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#0F1A2A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Open Graph fallback -->
    <meta property="og:site_name" content="Kashi Property Clinic" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kashi Property Clinic | Trusted Real Estate in Kashipur" />
    <meta property="og:description" content="Explore premium villas, plots and flats in Kashipur, Uttarakhand with Kashi Property Clinic." />
    <meta property="og:image" content="https://www.kashipropertyclinic.com/images/logo/property_clinic_main_logo.png" />
    <meta property="og:url" content="https://www.kashipropertyclinic.com/" />

    <!-- Geo / Local -->
    <meta name="geo.region" content="IN-UT" />
    <meta name="geo.placename" content="Kashipur, Uttarakhand, India" />
    <meta name="geo.position" content="29.2109;78.9621" />
    <meta name="ICBM" content="29.2109, 78.9621" />

    <!-- Font preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
</head>

</body>

</html>
